<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wayfinch Flights</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef7f4;
      --hero: linear-gradient(135deg, #f7fcff 0%, #dff5ef 54%, #fff4ed 100%);
      --card: rgba(255,255,255,.92);
      --card-solid: #ffffff;
      --ink: #102235;
      --muted: #66798a;
      --line: #dce8e5;
      --teal: #0f766e;
      --teal-2: #0b5f59;
      --coral: #e76f51;
      --coral-soft: #fff0ea;
      --shadow: 0 18px 45px rgba(15, 40, 52, .14);
      --soft-shadow: 0 10px 24px rgba(15, 40, 52, .10);
      --field: #ffffff;
      --scrim: rgba(8, 20, 32, .42);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #07131d;
      --hero: linear-gradient(135deg, #0b1d2a 0%, #0c302d 58%, #2b1c1b 100%);
      --card: rgba(17, 33, 45, .92);
      --card-solid: #102131;
      --ink: #e8f1f5;
      --muted: #9eb1bd;
      --line: #28414d;
      --teal: #3fb3a8;
      --teal-2: #75d6ce;
      --coral: #ff9b7c;
      --coral-soft: rgba(231, 111, 81, .16);
      --shadow: 0 18px 45px rgba(0, 0, 0, .34);
      --soft-shadow: 0 10px 24px rgba(0, 0, 0, .22);
      --field: #0c1b29;
      --scrim: rgba(0, 0, 0, .56);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    :disabled:not([data-inert]) { opacity: .48; cursor: not-allowed; }
    #root { height: 576px; width: 960px; margin: 0 auto; position: relative; overflow: hidden; background: var(--hero); }
    .shell { min-height: 100%; padding: 20px 28px 24px; position: relative; }
    .shell::before {
      content: ""; position: absolute; inset: -80px -40px auto auto; width: 340px; height: 220px;
      border-radius: 999px; background: rgba(15,118,110,.12); filter: blur(20px); pointer-events: none;
    }
    header { height: 44px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
    .mark { width: 31px; height: 31px; border-radius: 12px; background: var(--teal); display: grid; place-items: center; box-shadow: var(--soft-shadow); }
    .mark svg { width: 19px; height: 19px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav { display: flex; align-items: center; gap: 16px; }
    .nav a, .avatar { border: 0; background: transparent; color: var(--ink); font-weight: 650; padding: 8px 10px; border-radius: 12px; }
    .nav a:hover, .avatar:hover { background: rgba(15,118,110,.10); }
    .avatar { width: 38px; height: 38px; background: var(--card-solid); border: 1px solid var(--line); box-shadow: var(--soft-shadow); padding: 0; }
    .content { position: relative; z-index: 1; }
    .hero { display: grid; grid-template-columns: 1.04fr .96fr; gap: 22px; margin-top: 16px; }
    .headline { padding: 28px 8px 0 2px; }
    .eyebrow { color: var(--teal-2); font-weight: 800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 48px; line-height: .98; letter-spacing: -.055em; margin: 10px 0 12px; max-width: 430px; }
    .sub { color: var(--muted); font-size: 17px; line-height: 1.45; max-width: 400px; margin: 0; }
    .path-art { margin-top: 22px; height: 120px; position: relative; }
    .path-art svg { width: 100%; height: 100%; overflow: visible; }
    .search-card, .panel-card { background: var(--card); border: 1px solid rgba(255,255,255,.55); border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
    html[data-theme="dark"] .search-card, html[data-theme="dark"] .panel-card { border-color: rgba(255,255,255,.08); }
    .search-card { padding: 18px 18px 16px; align-self: start; }
    .field-grid { display: grid; grid-template-columns: 1fr 42px 1fr; gap: 10px; align-items: start; }
    label { display: block; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
    .field input { width: 100%; height: 50px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-weight: 760; letter-spacing: .03em; outline: none; }
    .field input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,118,110,.14); }
    .hint { height: 18px; margin-top: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .swap { align-self: end; margin-bottom: 23px; width: 42px; height: 42px; border-radius: 16px; border: 1px solid var(--line); background: var(--card-solid); color: var(--teal); display: grid; place-items: center; }
    .swap svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .date-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
    .date-pill { min-height: 74px; border: 1px solid var(--line); border-radius: 17px; background: var(--field); color: var(--ink); padding: 7px 3px 6px; text-align: center; display: grid; grid-template-rows: 16px 20px 16px; align-items: center; justify-items: center; min-width: 0; }
    .date-pill .dow { color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; line-height: 1; }
    .date-pill .day { color: var(--ink); font-size: 18px; font-weight: 900; line-height: 1; }
    .date-pill .fare-hint { color: var(--coral); font-size: 11px; font-weight: 850; line-height: 1; }
    .date-pill.active { border-color: var(--teal); background: rgba(15,118,110,.10); box-shadow: inset 0 0 0 1px var(--teal); }
    .passengers { margin: 12px 0 11px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
    .today { color: var(--ink); font-weight: 760; }
    .primary { border: 0; background: var(--teal); color: white; border-radius: 17px; height: 48px; padding: 0 20px; font-weight: 850; box-shadow: 0 10px 22px rgba(15,118,110,.23); }
    .primary:hover { background: var(--teal-2); }
    .primary.full { width: 100%; font-size: 16px; }
    .secondary { border: 1px solid var(--line); background: var(--card-solid); color: var(--ink); border-radius: 15px; min-height: 40px; padding: 0 14px; font-weight: 780; }
    .topbar { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .summary h2 { margin: 0; font-size: 28px; letter-spacing: -.035em; }
    .summary p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .tools { display: flex; gap: 10px; align-items: center; }
    .switch { border: 1px solid var(--line); border-radius: 999px; background: var(--card-solid); color: var(--ink); height: 40px; padding: 0 14px 0 42px; font-weight: 760; position: relative; }
    .switch::before { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 99px; left: 8px; top: 6px; background: #c7d8d4; transition: transform .16s ease, background .16s ease; }
    .switch[aria-checked="true"]::before { transform: translateX(17px); background: var(--teal); }
    .sort-label { position: absolute; left: -9999px; }
    select { height: 40px; border-radius: 14px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink); padding: 0 12px; font-weight: 720; }
    .results-list { margin-top: 14px; display: grid; gap: 9px; max-height: 386px; overflow: hidden; }
    .flight-row { display: grid; grid-template-columns: 168px 165px 115px 1fr 86px; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 19px; background: var(--card); color: var(--ink); text-align: left; box-shadow: 0 5px 16px rgba(15, 40, 52, .06); }
    .flight-row:hover { border-color: rgba(15,118,110,.45); transform: translateY(-1px); }
    .airline { display: flex; align-items: center; gap: 9px; font-weight: 820; min-width: 0; }
    .glyph { width: 27px; height: 27px; border-radius: 10px; background: linear-gradient(135deg, var(--teal), #6cc5bd); color: white; display: grid; place-items: center; font-size: 13px; flex: 0 0 auto; }
    .times { font-weight: 840; }
    .duration, .stops { color: var(--muted); font-size: 13px; }
    .price { justify-self: end; color: var(--coral); font-size: 19px; font-weight: 900; }
    .empty { margin-top: 72px; text-align: center; }
    .empty .orb { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 26px; background: var(--coral-soft); display: grid; place-items: center; color: var(--coral); }
    .empty h2 { margin: 0; font-size: 30px; letter-spacing: -.04em; }
    .empty p { color: var(--muted); max-width: 430px; margin: 10px auto 18px; }
    .review-grid { margin-top: 15px; display: grid; grid-template-columns: 1.35fr .75fr; gap: 16px; }
    .review-main, .price-card { background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 18px; }
    .backline { display:flex; justify-content:space-between; align-items:center; margin-top: 16px; }
    .trip-card { margin: 10px 0 12px; padding: 16px; border-radius: 22px; background: var(--card-solid); border: 1px solid var(--line); }
    .trip-title { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .trip-title h2 { margin: 0; font-size: 24px; letter-spacing: -.035em; }
    .badge { color: var(--coral); background: var(--coral-soft); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 850; }
    .timeline { display: grid; grid-template-columns: 1fr 80px 1fr; align-items: center; gap: 12px; margin-top: 18px; }
    .airport { display:flex; align-items:baseline; gap: 12px; font-size: 20px; }
    .airport-code { font-weight: 900; letter-spacing: .02em; }
    .airport-time { color: var(--muted); font-size: 13px; font-weight: 720; white-space: nowrap; }
    .airport small { display:block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 3px; }
    .line { height: 1px; border-top: 2px dotted var(--line); position: relative; }
    .line::after { content:""; position:absolute; right:-2px; top:-5px; width:8px; height:8px; border-radius:50%; background:var(--teal); }
    .meta { color: var(--muted); font-size: 13px; margin-top: 12px; }
    .fares { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fare { min-height: 89px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink); border-radius: 18px; padding: 10px; text-align: left; }
    .fare[aria-checked="true"] { border-color: var(--teal); box-shadow: inset 0 0 0 2px var(--teal); }
    .fare b { display:block; font-size: 14px; margin-bottom: 5px; }
    .fare strong { color: var(--coral); display:block; margin-bottom: 5px; }
    .fare span { color: var(--muted); font-size: 11px; line-height: 1.2; display:block; }
    .price-card h3 { margin: 0 0 12px; font-size: 20px; letter-spacing: -.02em; }
    .lineitem { display:flex; justify-content:space-between; margin: 9px 0; color: var(--muted); }
    .total { border-top: 1px solid var(--line); padding-top: 13px; margin-top: 13px; font-size: 22px; color: var(--ink); font-weight: 920; }
    .traveler { margin-top: 16px; padding: 13px; border:1px solid var(--line); border-radius: 18px; background: var(--card-solid); color: var(--muted); font-size: 13px; }
    .traveler strong { display:block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
    .booked { margin-top: 62px; display: grid; place-items: center; text-align:center; }
    .booked-card { width: 560px; padding: 34px; background: var(--card); border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow); }
    .checkmark { width: 70px; height: 70px; margin: 0 auto 16px; border-radius: 24px; background: var(--teal); color: white; display:grid; place-items:center; }
    .booked h1 { font-size: 40px; margin: 0 0 8px; }
    .code { display:inline-block; margin-top: 16px; padding: 10px 14px; border-radius: 14px; background: var(--coral-soft); color: var(--coral); font-weight: 900; letter-spacing: .08em; }
    .skeleton { margin-top: 28px; display:grid; gap:12px; }
    .skel { height:56px; border-radius:20px; background: linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.78), rgba(255,255,255,.35)); background-size: 180% 100%; animation: shimmer 1.4s infinite linear; border:1px solid var(--line); }
    html[data-theme="dark"] .skel { background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.14), rgba(255,255,255,.06)); }
    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    .overlay { position:absolute; inset:0; background: var(--scrim); display:grid; place-items:center; z-index: 10; }
    .dialog { width: 420px; background: var(--card-solid); color: var(--ink); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); padding: 24px; }
    .dialog h2 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.035em; }
    .dialog p { color: var(--muted); margin: 0 0 18px; line-height: 1.4; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; }
    .bar { align-self: end; width: min(760px, calc(100% - 48px)); margin-bottom: 24px; background: var(--card-solid); color: var(--ink); border:1px solid var(--line); border-radius:24px; padding:18px; box-shadow: var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .bar p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .bar-actions { display:flex; gap:10px; flex: 0 0 auto; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
<div id="root"></div>
<script src="../common/blink-scenario.js"></script>
<script>
(function(){
  "use strict";
  const K = window.BlinkScenarioKit;
  const root = document.getElementById("root");
  const codeInfo = {
    SEA: "Seattle–Tacoma Intl", BOS: "Boston Logan Intl", SFO: "San Francisco Intl", JFK: "New York Kennedy",
    DEN: "Denver Intl", MIA: "Miami Intl", ORD: "Chicago O'Hare", ATL: "Atlanta Hartsfield",
    LAX: "Los Angeles Intl", DCA: "Washington National", PDX: "Portland Intl", AUS: "Austin Bergstrom"
  };
  const routes = [
    ["SEA","BOS","Boston"], ["SFO","JFK","New York"], ["DEN","MIA","Miami"],
    ["ORD","ATL","Atlanta"], ["LAX","DCA","Washington"], ["PDX","AUS","Austin"]
  ];
  const week = [
    {dow:"Mon", day:12, label:"Mon, Oct 12", short:"Mon 12"}, {dow:"Tue", day:13, label:"Tue, Oct 13", short:"Tue 13"},
    {dow:"Wed", day:14, label:"Wed, Oct 14", short:"Wed 14"}, {dow:"Thu", day:15, label:"Thu, Oct 15", short:"Thu 15"},
    {dow:"Fri", day:16, label:"Fri, Oct 16", short:"Fri 16"}, {dow:"Sat", day:17, label:"Sat, Oct 17", short:"Sat 17"},
    {dow:"Sun", day:18, label:"Sun, Oct 18", short:"Sun 18"}
  ];
  const taskRng = K.stream("travel-task");
  const route = routes[Math.floor(taskRng() * routes.length)];
  const targetDate = week[1 + Math.floor(taskRng() * 5)];
  const target = { from: route[0], to: route[1], city: route[2], date: targetDate };
  const fareDefs = [
    {name:"Basic", add:0, perk:"Seat at check-in"},
    {name:"Main", add:42, perk:"Carry-on included"},
    {name:"Main Plus", add:86, perk:"Flex changes"},
    {name:"Premium", add:182, perk:"Roomier cabin"}
  ];
  const initial = makeInitialState();
  let s = initial;
  let lastRenderedModal = false;
  function makeInitialState(){
    const query = new URLSearchParams(location.search);
    const stateParam = K.params.state;
    const base = {
      page: "home", from: "", to: "", date: week[0].short, searched: false, nonStopOnly: false,
      sort: "Recommended", selectedFlightId: null, selectedFare: "Main", bookedCount: 0, failed: false,
      confirm: null, interruptOpen: false, interruptShown: false, directState: !!stateParam
    };
    if (stateParam) {
      base.from = target.from; base.to = target.to; base.date = target.date.short; base.searched = true;
      base.page = stateParam;
      if (stateParam === "review" || stateParam === "pay_confirm" || stateParam === "declined" || stateParam === "booked") {
        base.selectedFlightId = taskIndex() === 0 ? cheapestNonstop().id : taskFlight().id;
        base.selectedFare = taskIndex() === 1 ? "Main Plus" : "Main";
      }
      if (stateParam === "pay_confirm") base.confirm = "pay";
      if (stateParam === "declined") base.confirm = "declined";
      if (stateParam === "booked") base.bookedCount = 1;
    }
    if (!["home","loading","results","no_flights","review","pay_confirm","declined","booked"].includes(base.page)) base.page = "home";
    return base;
  }
  function taskIndex(){ return K.params.task === 1 ? 1 : 0; }
  function pad(n){ return String(n).padStart(2,"0"); }
  function money(n){ return "$" + n.toFixed(2); }
  function esc(str){ return String(str).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
  function cssId(str){ return String(str).replace(/[^a-z0-9]+/gi,"_"); }
  function flights(){
    const r = K.stream("flights-" + target.from + target.to + target.date.short);
    const bump = Math.floor(r()*28);
    const base = 158 + bump;
    const rows = [
      {id:"tern", airline:"Tern Atlantic", dep:"6:20 AM", arr:"12:34 PM", dur:"5h 14m", stop:"1 stop · ORD", nonstop:false, price:base, aircraft:"Airbus A220"},
      {id:"lark", airline:"Larkspur", dep:"7:05 AM", arr:"11:19 AM", dur:"4h 14m", stop:"Nonstop", nonstop:true, price:base+50, aircraft:"Boeing 737-8"},
      {id:"kestrel", airline:"Kestrel Air", dep:"8:15 AM", arr:"12:29 PM", dur:"4h 14m", stop:"Nonstop", nonstop:true, price:base+76, aircraft:"Airbus A321neo"},
      {id:"juniper", airline:"Juniper Air", dep:"9:40 AM", arr:"4:08 PM", dur:"5h 28m", stop:"1 stop · DTW", nonstop:false, price:base+34, aircraft:"Embraer 190"},
      {id:"osprey", airline:"Osprey Jet", dep:"11:30 AM", arr:"3:51 PM", dur:"4h 21m", stop:"Nonstop", nonstop:true, price:base+62, aircraft:"Boeing 737-9"},
      {id:"solace", airline:"Solace Air", dep:"2:05 PM", arr:"6:24 PM", dur:"4h 19m", stop:"Nonstop", nonstop:true, price:base+88, aircraft:"Airbus A320"},
      {id:"brindle", airline:"Brindle Air", dep:"5:45 PM", arr:"12:08 AM", dur:"5h 23m", stop:"1 stop · MSP", nonstop:false, price:base+44, aircraft:"Boeing 737-7"}
    ];
    return rows.map((f,i) => ({...f, rec:i, price:f.price + ((target.date.day % 3) * 4)}));
  }
  function hasService(from=s.from, to=s.to){
    return routes.some(r => r[0] === norm(from) && r[1] === norm(to));
  }
  function norm(v){ return String(v || "").trim().toUpperCase(); }
  function dateObj(short){ return week.find(d => d.short === short) || target.date; }
  function taskFlight(){ return flights().find(f => f.id === "kestrel"); }
  function cheapestNonstop(){ return flights().filter(f => f.nonstop).sort((a,b)=>a.price-b.price || a.rec-b.rec)[0]; }
  function selectedFlight(){ return flights().find(f => f.id === s.selectedFlightId) || null; }
  function fareByName(name){ return fareDefs.find(f => f.name === name) || fareDefs[1]; }
  function currentTotal(){
    const f = selectedFlight() || taskFlight(); const fare = fareByName(s.selectedFare);
    const farePrice = f.price + fare.add; const taxes = 38.30;
    return {fare: farePrice, taxes, total: farePrice + taxes};
  }
  function taskText(){
    if (taskIndex() === 1) return `Fly from "${target.from}" to "${target.to}" on ${target.date.label} on the ${taskFlight().dep} Kestrel Air flight in Main Plus, then pay.`;
    return `Search flights from "${target.from}" to "${target.to}" on ${target.date.label}. Filter to nonstop, sort by lowest price and open the cheapest nonstop flight. Stop at the review page; don't pay.`;
  }
  function maybeInterrupt(page){
    if (!K.params.interrupts || s.directState || s.interruptShown || s.interruptOpen) return;
    const r = K.stream("interrupt");
    const milestone = r() < .5 ? "results" : "review";
    const kind = r() < .5 ? "consent" : "promo";
    if (page === milestone) { s.interruptOpen = kind; s.interruptShown = true; }
  }
  function go(page){
    s.page = page; s.confirm = page === "pay_confirm" ? "pay" : page === "declined" ? "declined" : null;
    maybeInterrupt(page);
    render();
  }
  function search(){
    s.searched = true;
    if (!hasService()) go("no_flights"); else go("results");
  }
  function book(){
    const f = selectedFlight();
    const ok = taskIndex() === 1 && f && f.id === taskFlight().id && s.selectedFare === "Main Plus" && norm(s.from) === target.from && norm(s.to) === target.to && s.date === target.date.short;
    s.bookedCount += 1;
    if (ok && s.bookedCount === 1) go("booked"); else { s.failed = true; s.page = "booked"; render(); }
  }
  function header(){
    return `<header><a href="#" id="home-link" class="brand" aria-label="Wayfinch home"><span class="mark"><svg viewBox="0 0 24 24"><path d="M3 13.5 20 5l-6.1 15-3.2-6.1L3 13.5Z"></path></svg></span><span>Wayfinch</span></a><nav class="nav"><a href="#" id="trips-link" aria-label="Trips">Trips</a><button id="avatar" class="avatar" aria-label="Ava Reed">AR</button></nav></header>`;
  }
  function homeView(){
    const fares = week.map((d,i)=> 128 + ((K.params.seed*17 + i*23 + d.day) % 74));
    return `<div class="hero"><section class="headline"><div class="eyebrow">Flights for Mon Oct 12, 2026</div><h1>Find a calmer way across the sky.</h1><p class="sub">Compare polished routes, quiet cabins, and fair fares from your saved Wayfinch profile.</p><div class="path-art"><svg viewBox="0 0 430 130" aria-hidden="true"><path d="M18 92 C112 2 238 8 392 77" fill="none" stroke="var(--teal)" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round" opacity=".55"/><circle cx="18" cy="92" r="6" fill="var(--coral)"/><circle cx="392" cy="77" r="6" fill="var(--teal)"/><path d="M214 31l28 10-26 12 4-13-6-9Z" fill="var(--card-solid)" stroke="var(--teal)" stroke-width="2"/></svg></div></section><section class="search-card"><div class="field-grid"><div class="field"><label for="from-input">From</label><input id="from-input" autocomplete="off" placeholder="City or airport" value="${esc(s.from)}"><div class="hint" id="from-hint">${esc(codeInfo[norm(s.from)] || "Try SEA or SFO")}</div></div><button id="swap-airports" class="swap" aria-label="Swap airports"><svg viewBox="0 0 24 24"><path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4-4m-4 4 4 4"/></svg></button><div class="field"><label for="to-input">To</label><input id="to-input" autocomplete="off" placeholder="City or airport" value="${esc(s.to)}"><div class="hint" id="to-hint">${esc(codeInfo[norm(s.to)] || "Try BOS or JFK")}</div></div></div><div class="date-strip">${week.map((d,i)=>`<button class="date-pill ${s.date===d.short?'active':''}" id="date-${d.day}" aria-label="${d.short} $${fares[i]}"><span class="dow">${d.dow}</span><strong class="day">${d.day}</strong><span class="fare-hint">$${fares[i]}</span></button>`).join("")}</div><div class="passengers"><span>1 adult, Economy</span><span class="today">Today: Mon Oct 12</span></div><button id="search-button" class="primary full">Search flights</button></section></div>`;
  }
  function resultRows(){
    let arr = flights().slice();
    if (s.nonStopOnly) arr = arr.filter(f => f.nonstop);
    if (s.sort === "Price: lowest") arr.sort((a,b)=>a.price-b.price || a.rec-b.rec);
    if (s.sort === "Duration: shortest") arr.sort((a,b)=>parseInt(a.dur)-parseInt(b.dur) || a.rec-b.rec);
    if (s.sort === "Departure: earliest") arr.sort((a,b)=>a.rec-b.rec);
    return arr;
  }
  function loadingView(){
    return `<div class="topbar"><div class="summary"><h2>Finding flights</h2><p>${target.from} → ${target.to} · ${target.date.label} · 1 adult</p></div><button id="edit-search" class="secondary">Edit search</button></div><div class="skeleton">${Array.from({length:5},()=>'<div class="skel"></div>').join("")}</div>`;
  }
  function resultsView(){
    const d = dateObj(s.date);
    return `<div class="topbar"><div class="summary"><h2>${esc(norm(s.from))} → ${esc(norm(s.to))}</h2><p>${esc(d.label)} · 1 adult</p></div><div class="tools"><button id="edit-search" class="secondary">Edit search</button><button id="nonstop-switch" class="switch" role="switch" aria-checked="${s.nonStopOnly ? 'true':'false'}">Nonstop only</button><label class="sort-label" for="sort-select">Sort</label><select id="sort-select" aria-label="Sort">${["Recommended","Price: lowest","Duration: shortest","Departure: earliest"].map(v=>`<option value="${v}" ${s.sort===v?'selected':''}>${v}</option>`).join("")}</select></div></div><div class="results-list">${resultRows().map(f=>`<button class="flight-row" id="flight-${f.id}" aria-label="${f.airline} ${f.dep} $${f.price}"><span class="airline"><span class="glyph">${f.airline[0]}</span>${f.airline}</span><span class="times">${f.dep} – ${f.arr}</span><span class="duration">${f.dur}</span><span class="stops">${f.stop}</span><span class="price">$${f.price}</span></button>`).join("")}</div>`;
  }
  function noFlightsView(){
    return `<div class="topbar"><div class="summary"><h2>${esc(norm(s.from)||"Route")} → ${esc(norm(s.to)||"Route")}</h2><p>${esc(dateObj(s.date).label)} · 1 adult</p></div><button id="edit-search" class="secondary">Edit search</button></div><section class="empty"><div class="orb"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13.5 20 5l-6 15-3.5-6.2L3 13.5Z"/><path d="M4 21h16"/></svg></div><h2>No flights today</h2><p>Wayfinch does not serve that route on the selected date. Edit your search to try another city pair.</p><button id="empty-edit" class="primary" aria-label="Try another search">Edit search</button></section>`;
  }
  function reviewView(){
    const f = selectedFlight() || taskFlight(); const d = dateObj(s.date); const price = currentTotal();
    return `<div class="backline"><button id="back-results" class="secondary">Back to results</button><div class="summary"><p>${esc(norm(s.from))} → ${esc(norm(s.to))} · ${esc(d.label)}</p></div></div><div class="review-grid"><main class="review-main"><div class="trip-card"><div class="trip-title"><h2>${f.airline}</h2><span class="badge">${f.stop}</span></div><div class="timeline"><div><span class="airport"><span class="airport-code">${esc(norm(s.from))}</span><span class="airport-time">${f.dep}</span></span></div><div class="line"></div><div><span class="airport"><span class="airport-code">${esc(norm(s.to))}</span><span class="airport-time">${f.arr}</span></span></div></div><div class="meta">${f.dur} · ${f.aircraft} · ${esc(d.label)}</div></div><div class="fares">${fareDefs.map(fd=>`<button role="radio" class="fare" id="fare-${cssId(fd.name)}" aria-checked="${s.selectedFare===fd.name?'true':'false'}" aria-label="${fd.name} fare $${f.price+fd.add}"><b>${fd.name}</b><strong>$${f.price+fd.add}</strong><span>${fd.perk}</span></button>`).join("")}</div></main><aside class="price-card"><h3>Price summary</h3><div class="lineitem"><span>${esc(s.selectedFare)} fare</span><strong>$${price.fare}</strong></div><div class="lineitem"><span>Taxes and fees</span><strong>$${price.taxes.toFixed(2)}</strong></div><div class="lineitem total"><span>Total</span><strong>${money(price.total)}</strong></div><div class="traveler"><strong>Ava Reed</strong>Traveller · Card •••• 4417</div><button id="continue-button" class="primary full" style="margin-top:14px">Continue</button></aside></div>`;
  }
  function bookedView(){
    const f = selectedFlight() || taskFlight();
    return `<section class="booked"><div class="booked-card"><div class="checkmark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div><h1>You're going to ${esc(target.city)}</h1><p class="sub" style="margin:auto">${target.from} to ${target.to} on ${target.date.label} · ${f.airline} ${f.dep} · ${esc(s.selectedFare)}</p><span class="code">WF-${pad(K.params.seed)}${target.to}</span></div></section>`;
  }
  function modalView(){
    if (s.interruptOpen) {
      if (s.interruptOpen === "consent") return `<div class="overlay"><div class="bar" role="dialog" aria-label="Privacy choices"><div><strong>Travel cookies, grounded choices</strong><p>Keep necessary cookies for booking security. Optional analytics can wait.</p></div><div class="bar-actions"><button id="interrupt-dismiss" class="secondary">Necessary only</button><button id="interrupt-alt" class="primary">Accept all</button></div></div></div>`;
      return `<div class="overlay"><div class="dialog" role="dialog" aria-label="Wayfinch Plus"><h2>Try Wayfinch Plus?</h2><p>Unlock lounge alerts and flexible fare holds for this trip. Not needed to continue booking.</p><div class="dialog-actions"><button id="interrupt-dismiss" class="secondary">No thanks</button><button id="interrupt-alt" class="primary">Try Plus</button></div></div></div>`;
    }
    if (s.page === "pay_confirm" || s.confirm === "pay") {
      const price = currentTotal();
      return `<div class="overlay"><div class="dialog" role="dialog" aria-label="Confirm payment"><h2>Confirm and pay ${money(price.total)}</h2><p>Your saved card ending in 4417 will be charged for ${esc(selectedFlight()?.airline || "this flight")}.</p><div class="dialog-actions"><button id="cancel-pay" class="secondary">Cancel</button><button id="pay-now" class="primary">Pay now</button></div></div></div>`;
    }
    if (s.page === "declined" || s.confirm === "declined") {
      return `<div class="overlay"><div class="dialog" role="dialog" aria-label="Payment declined"><h2>Payment declined</h2><p>Your bank declined this charge. Try again with the saved card or cancel to review the trip.</p><div class="dialog-actions"><button id="cancel-pay" class="secondary">Cancel</button><button id="try-again" class="primary">Try again</button></div></div></div>`;
    }
    return "";
  }
  function shellContent(){
    let view = homeView();
    if (s.page === "loading") view = loadingView();
    if (s.page === "results") view = resultsView();
    if (s.page === "no_flights") view = noFlightsView();
    if (s.page === "review" || s.page === "pay_confirm" || s.page === "declined") view = reviewView();
    if (s.page === "booked") view = bookedView();
    return `<div id="shell" class="shell">${header()}<div class="content">${view}</div></div>`;
  }
  function render(){
    const hasModal = !!(s.interruptOpen || s.page === "pay_confirm" || s.page === "declined" || s.confirm);
    root.innerHTML = shellContent() + modalView();
    wire();
    if (hasModal) inertBackground(true);
    lastRenderedModal = hasModal;
  }
  function inertBackground(on){
    const shell = document.getElementById("shell"); if (!shell) return;
    if (on) shell.setAttribute("inert", ""); else shell.removeAttribute("inert");
    shell.querySelectorAll("button,input,select,textarea").forEach(el => { el.disabled = on; if (on) el.dataset.inert="1"; else delete el.dataset.inert; });
    shell.querySelectorAll("a[href], [role]").forEach(el => {
      if (on) { if (el.hasAttribute("href")) { el.dataset.href = el.getAttribute("href"); el.removeAttribute("href"); } if (el.hasAttribute("role")) { el.dataset.role = el.getAttribute("role"); el.removeAttribute("role"); } }
      else { if (el.dataset.href) { el.setAttribute("href", el.dataset.href); delete el.dataset.href; } if (el.dataset.role) { el.setAttribute("role", el.dataset.role); delete el.dataset.role; } }
    });
  }
  function wire(){
    const by = id => document.getElementById(id);
    by("home-link")?.addEventListener("click", e => { e.preventDefault(); s.page="home"; s.confirm=null; render(); });
    by("trips-link")?.addEventListener("click", e => { e.preventDefault(); });
    by("avatar")?.addEventListener("click", () => {});
    by("from-input")?.addEventListener("input", e => { s.from = e.target.value; render(); by("from-input")?.focus(); });
    by("to-input")?.addEventListener("input", e => { s.to = e.target.value; render(); by("to-input")?.focus(); });
    by("swap-airports")?.addEventListener("click", () => { [s.from, s.to] = [s.to, s.from]; render(); });
    week.forEach(d => by("date-"+d.day)?.addEventListener("click", () => { s.date = d.short; render(); }));
    by("search-button")?.addEventListener("click", search);
    by("edit-search")?.addEventListener("click", () => go("home"));
    by("empty-edit")?.addEventListener("click", () => go("home"));
    by("nonstop-switch")?.addEventListener("click", () => { s.nonStopOnly = !s.nonStopOnly; render(); });
    by("sort-select")?.addEventListener("change", e => { s.sort = e.target.value; render(); });
    resultRows().forEach(f => by("flight-"+f.id)?.addEventListener("click", () => { s.selectedFlightId = f.id; s.selectedFare = "Main"; go("review"); }));
    by("back-results")?.addEventListener("click", () => go(hasService()?"results":"no_flights"));
    fareDefs.forEach(fd => by("fare-"+cssId(fd.name))?.addEventListener("click", () => { s.selectedFare = fd.name; render(); }));
    by("continue-button")?.addEventListener("click", () => go("pay_confirm"));
    by("cancel-pay")?.addEventListener("click", () => { s.confirm=null; go("review"); });
    by("pay-now")?.addEventListener("click", book);
    by("try-again")?.addEventListener("click", book);
    by("interrupt-dismiss")?.addEventListener("click", () => { s.interruptOpen = false; render(); });
    by("interrupt-alt")?.addEventListener("click", () => { s.interruptOpen = false; render(); });
  }
  function isCorrectReviewForTask0(){
    const f = selectedFlight();
    return s.page === "review" && f && f.id === cheapestNonstop().id && norm(s.from) === target.from && norm(s.to) === target.to && s.date === target.date.short && !s.confirm && !s.interruptOpen;
  }
  function isCorrectBooking(){
    const f = selectedFlight();
    return s.page === "booked" && !s.failed && s.bookedCount === 1 && f && f.id === taskFlight().id && s.selectedFare === "Main Plus" && norm(s.from) === target.from && norm(s.to) === target.to && s.date === target.date.short;
  }
  function check(){
    try {
      if (s.failed) return {done:true, success:false, detail:"forbidden booking made"};
      if (taskIndex() === 0) return {done:isCorrectReviewForTask0() || s.bookedCount>0, success:isCorrectReviewForTask0() && s.bookedCount===0, detail:isCorrectReviewForTask0()?"reviewing cheapest nonstop":"not at target review"};
      return {done:isCorrectBooking() || (s.bookedCount>0 && !isCorrectBooking()), success:isCorrectBooking(), detail:isCorrectBooking()?"booking complete":"booking incomplete"};
    } catch(e) { return {done:false, success:false, detail:"check failed"}; }
  }
  function expected(){
    if (s.failed) return {selector:null, action:"none", value:null, done:false, risky:false, failed:true};
    if (s.interruptOpen) return {selector:"#interrupt-dismiss", action:"click", value:null, done:false, risky:false};
    const chk = check();
    if (chk.success && chk.done) return {selector:null, action:"none", value:null, done:true, risky:false};
    if (s.bookedCount > 0 && !chk.success) return {selector:null, action:"none", value:null, done:true, risky:false, failed:true};
    if (s.page === "pay_confirm") {
      if (taskIndex() === 1 && selectedFlight()?.id === taskFlight().id && s.selectedFare === "Main Plus") return {selector:"#pay-now", action:"click", value:null, done:false, risky:true};
      return {selector:"#cancel-pay", action:"click", value:null, done:false, risky:false};
    }
    if (s.page === "declined") {
      if (taskIndex() === 1 && selectedFlight()?.id === taskFlight().id && s.selectedFare === "Main Plus") return {selector:"#try-again", action:"click", value:null, done:false, risky:true};
      return {selector:"#cancel-pay", action:"click", value:null, done:false, risky:false};
    }
    if (s.page === "review") {
      if (taskIndex() === 0) {
        if (isCorrectReviewForTask0()) return {selector:null, action:"none", value:null, done:true, risky:false};
        return {selector:"#back-results", action:"click", value:null, done:false, risky:false};
      }
      if (selectedFlight()?.id !== taskFlight().id) return {selector:"#back-results", action:"click", value:null, done:false, risky:false};
      if (s.selectedFare !== "Main Plus") return {selector:"#fare-Main_Plus", action:"click", value:null, done:false, risky:false};
      return {selector:"#continue-button", action:"click", value:null, done:false, risky:false};
    }
    if (s.page === "results") {
      if (norm(s.from) !== target.from || norm(s.to) !== target.to || s.date !== target.date.short) return {selector:"#edit-search", action:"click", value:null, done:false, risky:false};
      if (taskIndex() === 0) {
        if (!s.nonStopOnly) return {selector:"#nonstop-switch", action:"click", value:null, done:false, risky:false};
        if (s.sort !== "Price: lowest") return {selector:"#sort-select", action:"select", value:"Price: lowest", done:false, risky:false};
        return {selector:"#flight-" + cheapestNonstop().id, action:"click", value:null, done:false, risky:false};
      }
      if (s.nonStopOnly && !taskFlight().nonstop) return {selector:"#nonstop-switch", action:"click", value:null, done:false, risky:false};
      return {selector:"#flight-" + taskFlight().id, action:"click", value:null, done:false, risky:false};
    }
    if (s.page === "no_flights" || s.page === "loading") return {selector:"#edit-search", action:"click", value:null, done:false, risky:false};
    if (norm(s.from) !== target.from) return {selector:"#from-input", action:"type", value:target.from, done:false, risky:false};
    if (norm(s.to) !== target.to) return {selector:"#to-input", action:"type", value:target.to, done:false, risky:false};
    if (s.date !== target.date.short) return {selector:"#date-" + target.date.day, action:"click", value:null, done:false, risky:false};
    return {selector:"#search-button", action:"click", value:null, done:false, risky:false};
  }
  function currentState(){
    if (s.interruptOpen) return s.page;
    if (s.page === "pay_confirm" || s.confirm === "pay") return "pay_confirm";
    if (s.page === "declined" || s.confirm === "declined") return "declined";
    return s.page;
  }
  K.register({ id:"travel", task:taskText(), values:[target.from, target.to], check, expected, state:currentState });
  render();
})();
</script>
</body>
</html>
