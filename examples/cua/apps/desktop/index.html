<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halcyon Desktop</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#10131b; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
<script src="../common/blink-scenario.js"></script>
</head>
<body>
<canvas id="desk" aria-label="Halcyon desktop"></canvas>
<script>
(() => {
  'use strict';
  const K = window.BlinkScenarioKit;
  const canvas = document.getElementById('desk');
  const ctx = canvas.getContext('2d');
  const W = 960, H = 576;
  const FONT = 'system-ui, ui-sans-serif, Arial, sans-serif';
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const now = () => performance.now();

  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  function ellipse(c,x,y,w,h){ c.beginPath(); c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2); }
  function rgba(hex,a){ const h=hex.replace('#',''); const n=parseInt(h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
  function fillTextFit(c,text,x,y,max){ let t=text; while(c.measureText(t).width>max && t.length>4) t=t.slice(0,-2)+'…'; c.fillText(t,x,y); }

  const rPhoto = K.stream('photos');
  const rMeta = K.stream('metadata');
  const rUi = K.stream('ui');
  const hueShift = K.between(K.stream('wallpaper'), -35, 35);
  const winOffset = K.between(rUi,-8,8);
  const titlePool = ['Harbor at Dusk','Harbor at Dawn','Granite Ridge','Salt Flats','Pine Lake','Pine Lodge','Night Market','Coral Coast','Morning Fog','Canyon Light','Canyon Night','Meadow Path','Snow Ridge','Silver Coast','Forest Lake','Forest Lane'];
  const subjects = ['mountain','harbor','desert','forest','city','meadow','snow','coast'];
  const titles = K.shuffle(rPhoto, titlePool).slice(0,8);
  const subjectOrder = K.shuffle(K.stream('subjects'), subjects);
  function sceneForTitle(title){ const t=title.toLowerCase(); if(t.includes('harbor')) return 'harbor'; if(t.includes('salt')) return 'salt'; if(t.includes('pine lake') || t.includes('forest lake')) return 'lake'; if(t.includes('pine') || t.includes('forest')) return 'forest'; if(t.includes('market')) return 'market'; if(t.includes('coral') || t.includes('silver coast')) return 'coast'; if(t.includes('fog')) return 'fog'; if(t.includes('canyon')) return 'canyon'; if(t.includes('granite') || t.includes('snow')) return 'ridge'; if(t.includes('meadow')) return 'meadow'; return 'coast'; }
  const photos = K.shuffle(rPhoto, titles.map((title,i)=>({ id:'photo-'+slug(title), title, subject:sceneForTitle(title), date:`Oct ${K.between(rMeta,3,27)}, 2026`, size:`${K.between(rMeta,2,8)}.${K.between(rMeta,1,9)} MB`, deleted:false })));
  const targetPhoto = photos[K.between(K.stream('target'),0,photos.length-1)];
  const initialSectionChoices = ['general','display','sound','network','privacy'];
  const initialSection = K.pick(K.stream('settings-section'), initialSectionChoices);
  const accents = [{id:'sage', name:'Sage', color:'#5d8b78'}, {id:'amber', name:'Amber', color:'#bd7b3a'}, {id:'rose', name:'Rose', color:'#b7677a'}, {id:'violet', name:'Violet', color:'#7d6bb5'}, {id:'slate', name:'Slate', color:'#60708a'}];
  const initialAccent = K.pick(K.stream('accent'), accents).id;
  const initialReduce = K.between(K.stream('reduce'),0,1) === 1;
  const taskIndex = K.params.task === 1 ? 1 : 0;
  const startTheme = K.params.theme === 'dark' ? 'dark' : 'light';
  const appearanceGoal = (taskIndex === 1 && startTheme === 'dark') ? 'light' : 'dark';
  const taskText = taskIndex === 0 ? `Open Photos and delete the photo “${targetPhoto.title}”.` : `Open Settings and switch the appearance to ${appearanceGoal[0].toUpperCase()+appearanceGoal.slice(1)}.`;

  const state = { app: null, view: 'desktop', modal: null, error: null, appearance: startTheme, settingsSection: initialSection, accent: initialAccent, reduce: initialReduce, viewerId: null, deletedIds: [], wrongDeleted: false, toast: null, toastAt: 0, animStart: 0, animKind: '' };
  const appNames = {files:'Files', photos:'Photos', mail:'Mail', music:'Music', notes:'Notes', settings:'Settings'};
  const dock = ['files','photos','mail','music','notes','settings'];
  function setApp(app){ state.modal=null; state.error=null; state.app=app; state.view=app; state.animStart=now(); state.animKind='open'; if(app==='settings') state.settingsSection = state.settingsSection || initialSection; if(app==='photos') state.viewerId=null; }
  function closeWindow(){ state.app=null; state.view='desktop'; state.modal=null; state.error=null; state.viewerId=null; state.animStart=now(); state.animKind='close'; }
  function openViewer(id){ state.app='photos'; state.view='photo'; state.viewerId=id; state.animStart=now(); state.animKind='open'; }
  function currentPhoto(){ return photos.find(p=>p.id===state.viewerId) || photos.find(p=>!p.deleted) || photos[0]; }
  function visiblePhotos(){ return photos.filter(p=>!p.deleted); }
  function toast(msg){ state.toast=msg; state.toastAt=now(); }
  function rect(id,name,role,x,y,w,h){ return {id,name,role,rect:{x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)}}; }
  function dockRects(){ return dock.map((app,i)=>rect('dock-'+app, appNames[app], 'button', 312+i*56, 500, 44, 48)); }
  function winRect(){ const off=winOffset; return {x:118+off,y:58+Math.round(off/2),w:724,h:418}; }
  function photoGridRects(){ const wr=winRect(), x0=wr.x+34, y0=wr.y+104, cellW=161, cellH=145; return visiblePhotos().slice(0,8).map((p,i)=>{ const col=i%4,row=Math.floor(i/4); return rect(p.id,p.title,'button',x0+col*cellW,y0+row*cellH,132,112); }); }
  function sectionRows(sec){ return ({general:['Show recent items','Use compact menus'],display:['True Tone','Night warmth','Menu contrast'],sound:['Interface sounds','Spatial balance'],network:['Private relay','Ask before joining'],privacy:['Location services','Share analytics']})[sec] || []; }
  function targetList(){
    if(state.modal==='confirm_delete') return [rect('confirm-cancel','Cancel','button',470,322,92,38), rect('confirm-delete','Delete','button',574,322,92,38)];
    if(state.modal==='error') return [rect('error-ok','OK','button',570,322,96,38)];
    let out = [];
    if(state.app) out.push(rect('win-close','Close','button',winRect().x+16,winRect().y+14,24,24));
    if(state.app==='photos' && state.view==='photos') out = out.concat(dockRects(), photoGridRects());
    else if(state.app==='photos' && state.view==='photo') out = out.concat(dockRects(), [rect('viewer-back','Library','button',winRect().x+54,winRect().y+52,88,34), rect('viewer-favorite','Favorite','button',winRect().x+526,winRect().y+52,92,34), rect('viewer-delete','Delete','button',winRect().x+628,winRect().y+52,82,34)]);
    else if(state.app==='settings') {
      out = out.concat(dockRects());
      if(state.settingsSection === 'appearance') out = out.concat([rect('appearance-light','Light','option',winRect().x+218,winRect().y+104,112,106), rect('appearance-dark','Dark','option',winRect().x+346,winRect().y+104,112,106), rect('appearance-auto','Auto','option',winRect().x+474,winRect().y+104,112,106), ...accents.map((a,i)=>rect('accent-'+a.id,a.name,'option',winRect().x+222+i*54,winRect().y+262,36,36)), rect('switch-reduce-transparency','Reduce transparency','switch',winRect().x+604,winRect().y+326,46,26)]);
      else { out.push(rect('settings-appearance','Appearance','tab',winRect().x+26,winRect().y+118,142,34)); sectionRows(state.settingsSection).forEach((row,i)=>out.push(rect('switch-'+slug(row),'Toggle '+row,'switch',winRect().x+600,winRect().y+126+i*58,46,26))); }
    } else if(state.app==='files') out = out.concat(dockRects(), [rect('file-documents','Documents','button',winRect().x+226,winRect().y+118,420,38), rect('file-archive','Archive','button',winRect().x+226,winRect().y+166,420,38), rect('file-field-notes','Field Notes','button',winRect().x+226,winRect().y+214,420,38)]);
    else if(state.app) out = out.concat(dockRects()); else out = dockRects();
    const seen = new Set();
    return out.filter(t=>{ const r=t.rect; const ok=!seen.has(t.id)&&r.x>=0&&r.y>=0&&r.w>0&&r.h>0&&r.x+r.w<=W&&r.y+r.h<=H; seen.add(t.id); return ok; }).slice(0,16);
  }
  function resetForStateParam(name){ if(!name) return; state.modal=null; state.error=null; state.toast=null; if(name==='desktop'){ state.app=null; state.view='desktop'; state.viewerId=null; } if(name==='photos'){ setApp('photos'); state.view='photos'; } if(name==='photo'){ setApp('photos'); openViewer(taskIndex===0 ? targetPhoto.id : photos[0].id); } if(name==='confirm_delete'){ setApp('photos'); openViewer(taskIndex===0 ? targetPhoto.id : photos[0].id); state.modal='confirm_delete'; } if(name==='settings'){ setApp('settings'); state.settingsSection=initialSection; } if(name==='appearance'){ setApp('settings'); state.settingsSection='appearance'; } if(name==='files'){ setApp('files'); } if(name==='error'){ setApp('photos'); state.view='photos'; state.modal='error'; state.error='“Pine Lake” can’t be opened. The original is still downloading.'; } }
  resetForStateParam(K.params.state);
  function clickTarget(id){ if(id.startsWith('dock-')) { setApp(id.slice(5)); if(id==='dock-photos') state.view='photos'; return; } if(id==='win-close') return closeWindow(); if(state.modal==='confirm_delete') { if(id==='confirm-cancel'){ state.modal=null; return; } if(id==='confirm-delete'){ const p=currentPhoto(); if(p){ p.deleted=true; state.deletedIds.push(p.id); if(p.id!==targetPhoto.id) state.wrongDeleted=true; } state.modal=null; state.view='photos'; state.viewerId=null; toast('Photo deleted'); return; } } if(state.modal==='error') { if(id==='error-ok'){ state.modal=null; state.error=null; } return; } if(id.startsWith('photo-')) return openViewer(id); if(id==='viewer-back'){ state.view='photos'; state.viewerId=null; return; } if(id==='viewer-favorite') { toast('Favorite updated'); return; } if(id==='viewer-delete') { state.modal='confirm_delete'; return; } if(id==='settings-appearance') { state.settingsSection='appearance'; return; } if(id.startsWith('appearance-')) { const v=id.replace('appearance-',''); if(v==='light'||v==='dark'||v==='auto') state.appearance=v; document.documentElement.dataset.theme = state.appearance==='dark'?'dark':'light'; state.animStart=now(); state.animKind='theme'; return; } if(id.startsWith('accent-')) { state.accent=id.slice(7); return; } if(id==='switch-reduce-transparency') { state.reduce=!state.reduce; return; } }
  canvas.addEventListener('pointerdown', e => { const b=canvas.getBoundingClientRect(); const x=(e.clientX-b.left)*W/b.width, y=(e.clientY-b.top)*H/b.height; const t=targetList().find(t=>x>=t.rect.x&&y>=t.rect.y&&x<=t.rect.x+t.rect.w&&y<=t.rect.y+t.rect.h); if(t) { clickTarget(t.id); draw(); } });
  function expected(){ const done = check().success; if(done) return {target:null, action:'none', value:null, done:true, risky:false}; if(taskIndex===0){ if(state.wrongDeleted) return {target:null, action:'none', value:null, done:false, risky:false, failed:true}; if(state.modal==='confirm_delete') return currentPhoto()?.id===targetPhoto.id ? {target:'confirm-delete', action:'click', value:null, done:false, risky:true} : {target:'confirm-cancel', action:'click', value:null, done:false, risky:false}; if(state.modal==='error') return {target:'error-ok', action:'click', value:null, done:false, risky:false}; if(state.app!=='photos' || state.view==='desktop') return {target:'dock-photos', action:'click', value:null, done:false, risky:false}; if(state.view==='photo') return currentPhoto()?.id===targetPhoto.id ? {target:'viewer-delete', action:'click', value:null, done:false, risky:false} : {target:'viewer-back', action:'click', value:null, done:false, risky:false}; if(!targetPhoto.deleted) return {target:targetPhoto.id, action:'click', value:null, done:false, risky:false}; return {target:null, action:'none', value:null, done:false, risky:false, failed:true}; } if(state.modal==='confirm_delete') return {target:'confirm-cancel', action:'click', value:null, done:false, risky:false}; if(state.modal==='error') return {target:'error-ok', action:'click', value:null, done:false, risky:false}; if(state.app!=='settings') return {target:'dock-settings', action:'click', value:null, done:false, risky:false}; if(state.settingsSection!=='appearance') return {target:'settings-appearance', action:'click', value:null, done:false, risky:false}; if(state.accent!==initialAccent) return {target:'accent-'+initialAccent, action:'click', value:null, done:false, risky:false}; if(state.reduce!==initialReduce) return {target:'switch-reduce-transparency', action:'click', value:null, done:false, risky:false}; if(state.appearance!==appearanceGoal) return {target:'appearance-'+appearanceGoal, action:'click', value:null, done:false, risky:false}; return {target:null, action:'none', value:null, done:true, risky:false}; }
  function check(){ if(taskIndex===0){ const success = targetPhoto.deleted && state.deletedIds.length===1 && state.deletedIds[0]===targetPhoto.id && !state.wrongDeleted; return {done:success, success, detail: success?'target photo deleted':(state.wrongDeleted?'wrong photo deleted':'not complete')}; } const success = state.appearance===appearanceGoal && state.accent===initialAccent && state.reduce===initialReduce; return {done:success, success, detail: success?'appearance switched':'not complete'}; }
  function stateName(){ if(state.modal==='error') return 'error'; if(state.modal==='confirm_delete') return 'confirm_delete'; if(!state.app) return 'desktop'; if(state.app==='photos') return state.view==='photo'?'photo':'photos'; if(state.app==='settings') return state.settingsSection==='appearance'?'appearance':'settings'; if(state.app==='files') return 'files'; return 'desktop'; }
  function resize(){ const dpr=window.devicePixelRatio||1; canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  window.addEventListener('resize', resize);
  function theme(){ return state.appearance==='dark' ? {dark:true,bg:'#131722',fg:'#f2f4f8',muted:'#aeb6c6',panel:'#202634',line:'#3a4152',glass:'rgba(28,34,48,.68)',shadow:'rgba(0,0,0,.42)'} : {dark:false,bg:'#eff3f1',fg:'#172026',muted:'#68737a',panel:'#ffffff',line:'#dde3e3',glass:'rgba(255,255,255,.68)',shadow:'rgba(34,47,62,.20)'}; }
  function drawWallpaper(){ const th=theme(); const g=ctx.createLinearGradient(0,0,W,H); const base=th.dark?['#101622','#243148','#4a3856']:['#dfeee8','#f3dcc5','#b9d4d0']; g.addColorStop(0,base[0]); g.addColorStop(.55,base[1]); g.addColorStop(1,base[2]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.globalAlpha=th.dark?.55:.75; for(let i=0;i<4;i++){ const y=250+i*62+(hueShift%12); const grd=ctx.createLinearGradient(0,y-120,W,y+130); grd.addColorStop(0, th.dark?`hsl(${210+hueShift+i*18},45%,${24+i*5}%)`:`hsl(${155+hueShift+i*13},34%,${72-i*5}%)`); grd.addColorStop(1, th.dark?`hsl(${270+hueShift+i*10},34%,${30+i*4}%)`:`hsl(${32+hueShift+i*9},44%,${78-i*4}%)`); ctx.fillStyle=grd; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W;x+=80) ctx.lineTo(x, y+Math.sin(x/95+i)*30+Math.cos(x/140+i)*22); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill(); } ctx.globalAlpha=1; }
  function drawBars(){ const th=theme(); ctx.fillStyle=th.glass; ctx.fillRect(0,0,W,32); ctx.fillStyle=th.fg; ctx.font=`600 13px ${FONT}`; ctx.fillText('Halcyon',18,21); ctx.font=`500 13px ${FONT}`; ctx.fillText(state.app?appNames[state.app]:'Desktop',92,21); ctx.textAlign='right'; ctx.fillText('Tue Oct 14  9:41',W-18,21); ctx.textAlign='left'; }
  function drawIcon(app,x,y,active){ const th=theme(); ctx.save(); ctx.translate(x,y); ctx.shadowColor=th.shadow; ctx.shadowBlur=10; ctx.shadowOffsetY=4; roundRect(ctx,0,0,44,44,12); ctx.fillStyle= app==='photos'?'#d98161':app==='settings'?'#7b8798':app==='files'?'#d2a14a':app==='mail'?'#5f9ea7':app==='music'?'#a76d8b':'#7aa06d'; ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.88)'; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; if(app==='photos'){ for(let i=0;i<6;i++){ ctx.save(); ctx.translate(22,22); ctx.rotate(i*Math.PI/3); ellipse(ctx,0,-12,12,20); ctx.fill(); ctx.restore(); } ctx.fillStyle='#f5cf66'; ellipse(ctx,17,17,10,10); ctx.fill(); } else if(app==='settings'){ ellipse(ctx,12,12,20,20); ctx.stroke(); ellipse(ctx,17,17,10,10); ctx.stroke(); } else if(app==='files'){ roundRect(ctx,10,14,24,17,3); ctx.fill(); ctx.fillRect(12,10,12,8); } else if(app==='mail'){ ctx.strokeRect(10,14,24,17); ctx.beginPath(); ctx.moveTo(10,14); ctx.lineTo(22,24); ctx.lineTo(34,14); ctx.stroke(); } else if(app==='music'){ ctx.beginPath(); ctx.moveTo(26,12); ctx.lineTo(26,27); ctx.stroke(); ellipse(ctx,14,27,12,9); ctx.fill(); ctx.fillRect(26,12,9,4); } else { ctx.fillRect(12,12,20,22); ctx.fillStyle='#fff'; ctx.fillRect(16,17,12,2); ctx.fillRect(16,22,12,2); } ctx.restore(); ctx.fillStyle=th.fg; ctx.font=`12px ${FONT}`; ctx.textAlign='center'; ctx.fillText(appNames[app],x+22,y+62); ctx.textAlign='left'; if(active){ ctx.fillStyle=th.fg; ellipse(ctx,x+18,y+50,8,3); ctx.fill(); } }
  function drawDock(){ const th=theme(); ctx.save(); ctx.shadowColor=th.shadow; ctx.shadowBlur=22; ctx.shadowOffsetY=8; roundRect(ctx,296,488,368,76,24); ctx.fillStyle=th.glass; ctx.fill(); ctx.restore(); dock.forEach((a,i)=>drawIcon(a,312+i*56,500,state.app===a)); }
  function drawWindow(){ if(!state.app) return; const th=theme(), wr=winRect(); const elapsed=now()-state.animStart; const k=state.animKind==='open'?clamp(elapsed/160,0,1):1; ctx.save(); ctx.translate(wr.x+wr.w/2,wr.y+wr.h/2); ctx.scale(.96+.04*k,.96+.04*k); ctx.globalAlpha=k; ctx.translate(-wr.x-wr.w/2,-wr.y-wr.h/2); ctx.shadowColor=th.shadow; ctx.shadowBlur=30; ctx.shadowOffsetY=16; roundRect(ctx,wr.x,wr.y,wr.w,wr.h,14); ctx.fillStyle=th.panel; ctx.fill(); ctx.shadowBlur=0; ctx.shadowOffsetY=0; ctx.strokeStyle=rgba(th.line, .9); ctx.stroke(); ctx.fillStyle=th.dark?'rgba(255,255,255,.04)':'rgba(20,32,40,.03)'; roundRect(ctx,wr.x,wr.y,wr.w,46,14); ctx.fill(); ctx.fillStyle='#d9675e'; ellipse(ctx,wr.x+16,wr.y+14,24,24); ctx.fill(); ctx.strokeStyle='rgba(90,20,20,.65)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(wr.x+24,wr.y+22); ctx.lineTo(wr.x+32,wr.y+30); ctx.moveTo(wr.x+32,wr.y+22); ctx.lineTo(wr.x+24,wr.y+30); ctx.stroke(); ctx.fillStyle=th.fg; ctx.font=`600 14px ${FONT}`; ctx.fillText(appNames[state.app],wr.x+56,wr.y+29); if(state.app==='photos') drawPhotos(wr); else if(state.app==='settings') drawSettings(wr); else if(state.app==='files') drawFiles(wr); else drawSimpleApp(wr); ctx.restore(); }
  function drawThumb(p,x,y,w,h,big=false){ const title=(p.title||'').toLowerCase(), dawn=title.includes('dawn'), night=title.includes('night'), dusk=title.includes('dusk'); const sky=ctx.createLinearGradient(x,y,x,y+h); const scene=p.subject; const top=night?'#11182a':dawn?'#ffd6a0':dusk?'#f0a06d':scene==='fog'?'#dbe2dd':'#98c9dc'; const mid=night?'#26365c':dawn?'#f7b786':dusk?'#6f789b':scene==='canyon'?'#e1a05d':'#b9d8ce'; const low=scene==='salt'?'#e9e1d1':scene==='ridge'?'#dfeaf0':scene==='market'?'#242b47':scene==='coast'?'#4aa0a5':'#6f9678'; sky.addColorStop(0,top); sky.addColorStop(.55,mid); sky.addColorStop(1,low); roundRect(ctx,x,y,w,h,big?12:8); ctx.fillStyle=sky; ctx.fill(); ctx.save(); roundRect(ctx,x,y,w,h,big?12:8); ctx.clip(); const S=(px,py)=>[x+px*w,y+py*h]; function poly(points,color){ ctx.fillStyle=color; ctx.beginPath(); points.forEach((pt,i)=>{ const [px,py]=S(pt[0],pt[1]); if(i)ctx.lineTo(px,py); else ctx.moveTo(px,py); }); ctx.closePath(); ctx.fill(); } function line(points,color,lw=2){ ctx.strokeStyle=color; ctx.lineWidth=Math.max(1,lw*(big?1.8:1)); ctx.beginPath(); points.forEach((pt,i)=>{ const [px,py]=S(pt[0],pt[1]); if(i)ctx.lineTo(px,py); else ctx.moveTo(px,py); }); ctx.stroke(); } function sun(px,py,r,c){ ctx.fillStyle=c; ellipse(ctx,x+px*w-r*w,y+py*h-r*w,r*w*2,r*w*2); ctx.fill(); } if(scene==='harbor'){ sun(dawn?.22:.78,dawn?.22:.25,.055,dawn?'#fff1bb':'#ffd082'); poly([[0,.58],[1,.55],[1,1],[0,1]],night?'#172a3e':'#286985'); for(let i=0;i<5;i++) line([[0,.68+i*.06],[1,.66+i*.045]],'rgba(255,255,255,.16)',1); poly([[.05,.63],[.48,.58],[.42,.68],[.02,.73]],'#5b3e2f'); for(let i=0;i<4;i++){ const bx=.18+i*.17; poly([[bx,.57],[bx+.08,.57],[bx+.06,.63],[bx-.02,.63]], i%2?'#f4ede0':'#d8604d'); line([[bx+.03,.57],[bx+.03,.47]],'#f6f2e8',1); poly([[bx+.035,.48],[bx+.10,.56],[bx+.035,.56]],'#fff3ca'); } } else if(scene==='salt'){ sun(.73,.25,.052,'rgba(255,255,255,.82)'); line([[0,.47],[1,.47]],'#f7eee2',2); poly([[0,.50],[1,.50],[1,1],[0,1]],' +w*.76,y+h); beam.addColorStop(0,'rgba(255,245,176,.70)'); beam.addColorStop(1,'rgba(255,245,176,0)'); ctx.fillStyle=beam; ctx.beginPath(); ctx.moveTo(x+w*.58,y); ctx.lineTo(x+w*.76,y); ctx.lineTo(x+w*.58,y+h); ctx.lineTo(x+w*.44,y+h); ctx.closePath(); ctx.fill(); poly([[0,.48],[.18,.32],[.33,.54],[.47,.28],[.58,.56],[.72,.36],[1,.53],[1,1],[0,1]],night?'#51314a':'#9a4f36'); poly([[0,.72],[.30,.58],[.54,.78],[.80,.60],[1,.72],[1,1],[0,1]],night?'#2d263a':'#6d382a'); for(let i=0;i<4;i++) line([[0,.62+i*.08],[1,.54+i*.07]],'rgba(255,206,124,.18)',1); } else if(scene==='ridge'){ sun(.72,.22,.045,'rgba(255,255,255,.85)'); poly([[0,.78],[.16,.35],[.30,.66],[.44,.22],[.62,.70],[.76,.32],[1,.78],[1,1],[0,1]],'#4b617b'); poly([[.11,.46],[.16,.35],[.22,.50],[.17,.47]],'#f4fbff'); poly([[.38,.35],[.44,.22],[.52,.44],[.45,.38]],'#f4fbff'); poly([[.70,.43],[.76,.32],[.84,.52],[.77,.47]],'#f4fbff'); poly([[0,.82],[1,.75],[1,1],[0,1]],'#dce9ee'); } else { sun(.72,.20,.045,'#fff0a6'); poly([[0,.68],[.22,.54],[.45,.64],[.70,.49],[1,.62],[1,1],[0,1]],'#69a85c'); poly([[0,.82],[.35,.66],[.72,.84],[1,.70],[1,1],[0,1]],'#8dbf67'); for(let i=0;i<18;i++){ ctx.fillStyle=i%3?'#fff2a8':'#e8797c'; ellipse(ctx,x+((i*37)%100/100)*w,y+(.72+((i*19)%24)/100)*h,Math.max(2,w*.018),Math.max(2,w*.018)); ctx.fill(); } line([[.12,.98],[.42,.72],[.72,.58]],'rgba(255,245,210,.55)',2); } ctx.restore(); ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1; roundRect(ctx,x+.5,y+.5,w-1,h-1,big?12:8); ctx.stroke(); }
  function drawPhotos(wr){ const th=theme(); if(state.view==='photo'){ const p=currentPhoto(); ctx.fillStyle=th.dark?'#171c28':'#f4f7f6'; roundRect(ctx,wr.x+30,wr.y+94,wr.w-60,252,12); ctx.fill(); drawThumb(p,wr.x+54,wr.y+112,410,216,true); ctx.fillStyle=th.fg; ctx.font=`600 22px ${FONT}`; fillTextFit(ctx,p.title,wr.x+492,wr.y+146,190); ctx.font=`13px ${FONT}`; ctx.fillStyle=th.muted; ctx.fillText(`${p.date} · ${p.size}`,wr.x+492,wr.y+174); button('Library',wr.x+54,wr.y+52,88,34,false); button('♡ Favorite',wr.x+526,wr.y+52,92,34,false); button('Delete',wr.x+628,wr.y+52,82,34,true); return; } ctx.font=`600 20px ${FONT}`; ctx.fillStyle=th.fg; ctx.fillText('Library',wr.x+34,wr.y+86); photoGridRects().forEach(t=>{ const p=photos.find(p=>p.id===t.id); drawThumb(p,t.rect.x,t.rect.y,t.rect.w,82); ctx.fillStyle=th.fg; ctx.font=`600 13px ${FONT}`; fillTextFit(ctx,p.title,t.rect.x,t.rect.y+104,t.rect.w); ctx.fillStyle=th.muted; ctx.font=`12px ${FONT}`; ctx.fillText(p.date,t.rect.x,t.rect.y+122); }); }

  function drawSettings(wr){ const th=theme(); ctx.fillStyle=th.dark?'#1a202c':'#f4f6f5'; roundRect(ctx,wr.x+14,wr.y+54,166,342,12); ctx.fill(); ['general','appearance','display','sound','network','privacy'].forEach((s,i)=>{ const y=wr.y+70+i*48; if(state.settingsSection===s){ roundRect(ctx,wr.x+26,y,142,34,9); ctx.fillStyle=rgba(accents.find(a=>a.id===state.accent).color,.20); ctx.fill(); } ctx.fillStyle=th.fg; ctx.font=`600 13px ${FONT}`; ctx.fillText(s[0].toUpperCase()+s.slice(1),wr.x+44,y+22); }); if(state.settingsSection==='appearance') drawAppearance(wr); else drawSettingSection(wr); }
  function drawAppearance(wr){ const th=theme(), contentX=wr.x+218, accentColor=accents.find(a=>a.id===state.accent).color; ctx.fillStyle=th.fg; ctx.font=`600 24px ${FONT}`; ctx.fillText('Appearance',contentX,wr.y+90); ['light','dark','auto'].forEach((m,i)=>{ const x=contentX+i*128,y=wr.y+104; roundRect(ctx,x,y,112,106,14); ctx.fillStyle=state.appearance===m?rgba(accentColor,.22):(th.dark?'#252c39':'#f7f9f8'); ctx.fill(); ctx.strokeStyle=state.appearance===m?accentColor:th.line; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle=m==='dark'?'#273041':'#ffffff'; roundRect(ctx,x+18,y+18,76,48,8); ctx.fill(); ctx.fillStyle=m==='dark'?'#cfd6e4':'#c8d8d1'; ctx.fillRect(x+28,y+30,56,5); ctx.fillRect(x+28,y+42,38,5); ctx.fillStyle=th.fg; ctx.font=`600 13px ${FONT}`; ctx.textAlign='center'; ctx.fillText(m[0].toUpperCase()+m.slice(1),x+56,y+88); ctx.textAlign='left'; }); ctx.fillStyle=th.fg; ctx.font=`600 15px ${FONT}`; ctx.fillText('Accent colour',contentX,wr.y+246); accents.forEach((a,i)=>{ const x=contentX+4+i*54,y=wr.y+262; ellipse(ctx,x,y,36,36); ctx.fillStyle=a.color; ctx.fill(); if(state.accent===a.id){ ctx.strokeStyle=th.fg; ctx.lineWidth=3; ctx.stroke(); } }); ctx.fillStyle=th.fg; ctx.fillText('Reduce transparency',contentX,wr.y+344); drawSwitch(wr.x+604,wr.y+326,state.reduce); }

  function drawSettingSection(wr){ const th=theme(), sec=state.settingsSection; ctx.fillStyle=th.fg; ctx.font=`600 24px ${FONT}`; ctx.fillText(sec[0].toUpperCase()+sec.slice(1),wr.x+218,wr.y+90); sectionRows(sec).forEach((row,i)=>{ const y=wr.y+118+i*58; ctx.fillStyle=th.dark?'#252c39':'#f7f9f8'; roundRect(ctx,wr.x+218,y,444,44,10); ctx.fill(); ctx.fillStyle=th.fg; ctx.font=`600 14px ${FONT}`; ctx.fillText(row,wr.x+238,y+27); drawSwitch(wr.x+600,y+9,i%2===0); }); ctx.fillStyle=th.muted; ctx.font=`13px ${FONT}`; ctx.fillText('Choose Appearance in the sidebar to change the desktop theme.',wr.x+218,wr.y+330); }

  function drawToast(){ if(!state.toast || now()-state.toastAt>2100) return; const th=theme(); ctx.save(); ctx.globalAlpha=clamp(1-(now()-state.toastAt-1600)/500,0,1); ctx.shadowColor=th.shadow; ctx.shadowBlur=18; roundRect(ctx,402,452,156,38,18); ctx.fillStyle=th.dark?'rgba(245,247,252,.92)':'rgba(22,30,36,.90)'; ctx.fill(); ctx.fillStyle=th.dark?'#10131b':'#fff'; ctx.font=`600 13px ${FONT}`; ctx.textAlign='center'; ctx.fillText(state.toast,480,476); ctx.textAlign='left'; ctx.restore(); }
  // Keep drawing while an animation or toast runs, then once more so the settled frame is always painted
  // (a late rAF must not leave a window half faded in).
  let settling = false, scheduled = false;
  function draw(){
    drawWallpaper(); drawBars(); drawWindow(); drawDock(); drawModal(); drawToast();
    const busy = (state.toast && now()-state.toastAt<2200) || (now()-state.animStart<190);
    if ((busy || settling) && !scheduled) {
      settling = busy; scheduled = true;
      requestAnimationFrame(() => { scheduled = false; draw(); });
    }
  }
  K.register({ id:'desktop', task:taskText, values:[], check, expected, state:stateName, targets:targetList }); resize(); draw();
})();
