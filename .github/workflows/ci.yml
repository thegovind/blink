name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check blink examples scripts space lab site

  tests:
    runs-on: ubuntu-latest
    env:
      BLINK_MOCK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install "pillow==12.3.0"
      - run: python -m unittest discover -s space -p 'test_*.py'
      - run: python -m unittest discover -s lab/tests -p 'test_*.py'

  cua-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "playwright==1.55.0" "pillow==12.3.0" httpx imageio-ffmpeg pytest
      - run: python -m playwright install --with-deps chromium
      # one process per file: the sync-Playwright app tests leave an event loop that breaks later asyncio.run()
      - run: for f in examples/cua/tests/test_*.py; do python -m pytest -q -p no:cacheprovider "$f" || exit 1; done

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/leak_scan.py .
