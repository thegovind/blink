[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-decisions"
version = "1.1.0"
description = "One-pass typed-decision runtime, demo, training, and evaluation tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Govind Kamtamneni"}]
dependencies = [
  "accelerate>=1.0",
  "huggingface_hub>=0.24",
  "safetensors>=0.4",
]

[project.optional-dependencies]
serve = [
  "torch==2.13.0",
  "transformers==5.17.0",
  "flash-linear-attention==0.5.2",
]
space = [
  "gradio==6.28.0",
  "spaces",
  "torch==2.13.0",
  "transformers==5.17.0",
  "flash-linear-attention==0.5.2",
]
train = [
  "torch==2.13.0",
  "transformers==5.17.0",
  "flash-linear-attention==0.5.2",
  "peft>=0.12",
  "datasets>=2.20",
  "numpy>=1.26",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "requests>=2.32",
]

[tool.setuptools]
packages = ["blink"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
exclude = ["docs/models/**"]
