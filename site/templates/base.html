<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f5f5f5">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{meta}}
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts_css}}">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script>document.documentElement.classList.add("js")</script>
<script defer src="{{root}}assets/site.js"></script>
</head>
<body class="{{body_class}}" data-copy="{{copy}}" data-copied="{{copied}}">
<a class="skip" href="#main">{{skip}}</a>
<header class="top">
<div class="top-in">
<a class="brand" href="{{home}}"><span class="word">blink<em class="dot" aria-hidden="true"></em></span></a>
<nav class="top-links" aria-label="{{nav_aria}}">{{top_links}}</nav>
</div>
</header>
{{body}}
<footer class="foot">
<div class="foot-in">
<p class="foot-note">{{footer_note}}</p>
<p class="foot-links"><a href="{{github_url}}">{{github}}</a><a href="{{space_url}}">{{space}}</a><a href="{{hub_url}}">{{hub}}</a><a href="{{root}}llms.txt">llms.txt</a></p>
</div>
</footer>
</body>
</html>
